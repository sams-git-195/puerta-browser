name: Build & Release App

permissions:
  contents: write

on:
  # Builds the app when a new tag is created
  push:
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

jobs:
  # Targets: Linux x64 (deb + rpm) and Windows x64 (NSIS .exe). macOS stays off until Apple signing
  # credentials exist. Windows builds are unsigned and not VMP-signed (no Castlabs EVS login), so
  # Windows shows a SmartScreen prompt and cannot play Widevine DRM content.
  # The Flatpak setup was removed too: it served upstream's Flathub packaging, which does not apply
  # to this fork.
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not cancel the other's artifacts.
      fail-fast: false
      matrix:
        # windows-2022, not windows-latest: better-sqlite3 compiles from source for the Castlabs
        # Electron, and node-gyp 11 cannot find the newer Visual Studio on windows-latest.
        os: [ubuntu-latest, windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y elfutils dpkg fakeroot rpm

      - name: Install Dependencies
        run: bun install --development --frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:linux -p always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Windows
        if: matrix.os == 'windows-2022'
        run: bun run build:win -p always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.blockmap
