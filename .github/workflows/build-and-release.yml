name: Build & Release App

permissions:
  contents: write

on:
  # Builds the app when a new tag is created
  push:
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

jobs:
  # macOS/Windows builds removed — require Apple signing + Castlabs EVS credentials we don't have yet.
  # Re-add from upstream history if credentials materialize.
  # The Flatpak setup was removed too: it served upstream's Flathub packaging, which does not apply
  # to this fork.
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10

      - name: Use Stock Electron (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bun run script:use-stock-electron

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y elfutils dpkg fakeroot rpm

      - name: Install Additional Build Dependencies (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get install -y ruby ruby-dev
          sudo gem install --no-document fpm -v 1.17.0

      - name: Install Dependencies
        run: bun install --development --frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: bun run build:linux -p always
        env:
          USE_SYSTEM_FPM: ${{ matrix.os == 'ubuntu-24.04-arm' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
