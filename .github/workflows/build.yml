name: Build App

permissions: {}

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run on every push to a pull request
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress jobs when a new push is made to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs before the build starts
  # Cannot find a way to do this yet without compromising security
  before-build-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with build status
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ### Build is in progress... 🚀
            Currently building for this pull request!
          comment-tag: build

  # Targets: Linux x64 (deb + rpm) and Windows x64 (NSIS .exe). macOS stays off until Apple signing
  # credentials exist. Windows builds are unsigned and not VMP-signed (no Castlabs EVS login), so
  # Windows shows a SmartScreen prompt and cannot play Widevine DRM content.
  # The Flatpak job was removed too: it built upstream's Flathub packaging, which does not apply to
  # this fork.

  # Runs the build
  build:
    needs: before-build-comment
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not cancel the other's artifacts.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y elfutils dpkg fakeroot rpm

      - name: Install Dependencies
        run: bun install --development --frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:linux -p never

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: bun run build:win -p never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.blockmap

  # Runs after all builds complete
  after-build-comment:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      BUILD_ARTIFACTS_MESSAGE: |
        ### Puerta Browser build artifacts are ready! 🚀
        Download the artifacts for:
        - [Linux x64 (.deb / .rpm)](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/ubuntu-latest.zip)
        - [Windows x64 (.exe)](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/windows-latest.zip)

        _(execution **${{ github.run_id }}** / attempt **${{ github.run_attempt }}**)_
    steps:
      - name: Add workflow summary
        run: printf '%s\n' "$BUILD_ARTIFACTS_MESSAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with artifact links
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        continue-on-error: true
        with:
          message: ${{ env.BUILD_ARTIFACTS_MESSAGE }}
          comment-tag: build
